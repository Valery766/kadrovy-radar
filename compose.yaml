# Все локальные компоненты решения одной командой: docker compose up --build
# Единственный сервис: сервер (API + чат-бот + мини-приложение) с базой SQLite в томе.
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PACKS_DIR: /app/packs
      HOST: 0.0.0.0
      NODE_EXTRA_CA_CERTS: /app/server/certs/russian_trusted_bundle.pem
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - stavka-data:/data
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  stavka-data:
