# Все локальные компоненты решения одной командой: docker compose up --build
# Единственный сервис: сервер (API + чат-бот + мини-приложение) с базой SQLite в томе.
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PACKS_DIR: /app/packs
      HOST: 0.0.0.0
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - stavka-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  stavka-data:
