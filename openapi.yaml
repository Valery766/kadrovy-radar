components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: HMAC-signed application session
      description: token из POST /api/session. Для настоящих ролей запуск из выданного бота MAX.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Машинный код причины
        message:
          type: string
          description: Описание для пользователя
        reason:
          type: string
      required:
        - error
      additionalProperties: true
    Health:
      type: object
      properties:
        ok:
          const: true
        uptimeSec:
          type: integer
        updatesMode:
          type: string
          enum:
            - none
            - webhook
            - polling
        bot:
          anyOf:
            - type: object
              properties:
                username:
                  type: string
              required:
                - username
              additionalProperties: true
            - type: "null"
        lastUpdateAt:
          anyOf:
            - type: string
            - type: "null"
        webhookCheckedAt:
          anyOf:
            - type: string
            - type: "null"
        packs:
          type: array
          items:
            type: string
        inspections:
          type: object
          properties:
            loaded:
              type: boolean
            year:
              type: integer
            version:
              anyOf:
                - type: string
                - type: "null"
            records:
              type: integer
            withRegion:
              type: integer
            loadedAt:
              anyOf:
                - type: string
                - type: "null"
          required:
            - loaded
            - year
            - version
            - records
            - withRegion
            - loadedAt
          additionalProperties: true
      required:
        - ok
        - uptimeSec
        - updatesMode
        - bot
        - lastUpdateAt
        - webhookCheckedAt
        - packs
        - inspections
      additionalProperties: true
    Session:
      type: object
      properties:
        token:
          type: string
          description: Сессионный Bearer-токен приложения, срок жизни 12 часов; не токен MAX Bot API
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              anyOf:
                - type: string
                - type: "null"
            demo:
              type: boolean
            chatId:
              anyOf:
                - type: integer
                - type: "null"
          required:
            - id
            - name
            - demo
            - chatId
          additionalProperties: true
        startParam:
          anyOf:
            - type: string
            - type: "null"
      required:
        - token
        - user
        - startParam
      additionalProperties: true
    Bootstrap:
      type: object
      properties:
        bot:
          anyOf:
            - type: object
              properties: {}
              required: []
              additionalProperties: true
            - type: "null"
        packs:
          type: array
          items:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        regions:
          type: array
          items: *a10
        professions:
