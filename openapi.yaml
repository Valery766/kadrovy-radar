openapi: 3.1.0
info:
  title: "Кадровый радар: API мини-приложения MAX"
  version: 0.1.0
  description: "Контракт методов mini-app по исходникам конкурсного выпуска 30.09.2026. API является
    частью продукта. Основной путь: рынок, публикация, каталог, отклик, решение работодателя. Доступ через
    сессионный Bearer приложения, не через MAX_BOT_TOKEN. Тяжелые расчеты: 6 вызовов в минуту на
    MAX-пользователя, 3 в минуту на IP демо, максимум 4 одновременно. Демо-сессии: 20 в минуту на IP.
    Максимальное JSON-тело 1 МиБ. Входящий webhook MAX относится к транспортной интеграции и не является
    методом мини-приложения."
servers:
  - url: https://radar.digital-projects.tech
    description: Рабочий сервис
  - url: http://localhost:8080
    description: Локальный Docker, MAX_UPDATES_MODE=none
paths:
  /api/health:
    get:
      operationId: get__api_health
      summary: Состояние сервиса
      parameters: []
      security: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/session:
    post:
      operationId: post__api_session
      summary: Создать сессию MAX или демо-сессию
      parameters: []
      security: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type: string
                  description: Подлинная window.WebApp.initData из запуска MAX. Без этого поля выдается демо-сессия.
                  maxLength: 8192
                demo:
                  type: boolean
              required: []
              additionalProperties: true
      description: Без initData возвращается демо-сессия (публичный каталог и расчеты, без публикаций и откликов).
        Настоящая initData проверяется HMAC по токену бота, допустимый возраст 3600 секунд; user.id
        обязателен. Сессионный токен живет 12 часов. Поддельные подписи и общие учетные записи не
        используются.
  /api/bootstrap:
    get:
      operationId: get__api_bootstrap
      summary: Справочники и состояние текущего пользователя
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/profile:
    post:
      operationId: post__api_profile
      summary: Получить профиль бизнеса по ИНН
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties: {}
                    required: []
                    additionalProperties: true
                  region:
                    anyOf:
                      - &a10
                        type: object
                        properties:
                          fnsCode:
                            type: string
                          code:
                            type: string
                          name:
                            type: string
                          avgSalary:
                            anyOf:
                              - type: number
                              - type: "null"
                        required:
                          - fnsCode
                          - code
                          - name
                          - avgSalary
                        additionalProperties: true
                      - type: "null"
                  pack:
                    type: object
                    properties: {}
                    required: []
                    additionalProperties: true
                required:
                  - profile
                  - region
                  - pack
                additionalProperties: true
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inn:
                  type: string
                  description: Корректный ИНН с контрольной суммой
                  pattern: ^(\d{10}|\d{12})$
              required:
                - inn
              additionalProperties: true
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
  /api/market:
    post:
      operationId: post__api_market
      summary: Рассчитать карточку рынка
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                professionKey: &a2
                  type: string
                  description: Ключ из bootstrap/professions
                professionText: &a3
                  type: string
                  description: Свободное название должности
                  maxLength: 120
                regionFnsCode: &a4
                  type: string
                  description: Код ФНС, например 78
                inn: &a5
                  anyOf:
                    - type: string
                    - type: "null"
                offer: &a6
                  anyOf:
                    - type: number
                      minimum: 1000
                      maximum: 5000000
                    - type: "null"
                forceRefresh: &a7
                  type: boolean
                keepRegion: &a8
                  type: boolean
              required: []
              additionalProperties: true
      description: Требуется professionKey или professionText и выбранный регион/ИНН. Сохраняется карточка расчета,
        даже для демо. Источники могут временно вернуть 503. forceRefresh учитывается только для реального
        MAX-пользователя.
  /api/cards/{id}:
    get:
      operationId: get__api_cards_id
      summary: Прочитать карточку рынка по идентификатору
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ресурс отсутствует или скрыт от пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cards/{id}/report:
    post:
      operationId: post__api_cards_id_report
      summary: Отправить PDF в диалог MAX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  mid:
                    type: string
                  chatType:
                    const: DIALOG
                  reused:
                    type: boolean
                required:
                  - mid
                  - chatType
                  - reused
                additionalProperties: true
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ресурс принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ресурс отсутствует или скрыт от пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: true
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
  /api/cards/{id}/subscribe:
    post:
      operationId: post__api_cards_id_subscribe
      summary: Подписаться на обновления рынка
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties: {}
                    required: []
                    additionalProperties: true
                required:
                  - subscription
                additionalProperties: true
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ресурс принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ресурс отсутствует или скрыт от пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: true
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
  /api/subscriptions:
    get:
      operationId: get__api_subscriptions
      summary: Подписки пользователя
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties: {}
                      required: []
                      additionalProperties: true
                required:
                  - subscriptions
                additionalProperties: true
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/subscriptions/{id}:
    delete:
      operationId: delete__api_subscriptions_id
      summary: Отключить свою подписку
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: true
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
  /api/professions/suggest:
    get:
      operationId: get__api_professions_suggest
      summary: Подсказки должностей
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
            maximum: 25
            default: 10
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties: {}
                      required: []
                      additionalProperties: true
                required:
                  - suggestions
                additionalProperties: true
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/staff:
    post:
      operationId: post__api_staff
      summary: Оценить ставки штата
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema: &a1
              type: object
              properties:
                positions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      salary:
                        type: number
                        minimum: 1000
                        maximum: 5000000
                      professionKey:
                        anyOf:
                          - type: string
                          - type: "null"
                    required:
                      - title
                      - salary
                    additionalProperties: true
                  minItems: 1
                  maxItems: 20
                regionFnsCode:
                  type: string
                inn:
                  anyOf:
                    - type: string
                    - type: "null"
                forceRefresh:
                  type: boolean
              required:
                - positions
              additionalProperties: true
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
    get:
      operationId: get__api_staff
      summary: Последняя оценка штата
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    anyOf:
                      - $ref: "#/components/schemas/Staff"
                      - type: "null"
                required:
                  - report
                additionalProperties: true
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema: *a1
  /api/inspections:
    get:
      operationId: get__api_inspections
      summary: Плановые проверки из ЕРКНМ
      parameters:
        - name: inn
          in: query
          required: false
          schema:
            type: string
            description: Необязательный корректный ИНН
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspections"
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/regions/compare:
    post:
      operationId: post__api_regions_compare
      summary: Сравнить рынки регионов
      parameters: []
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionComparison"
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                professionKey: *a2
                professionText: *a3
                regionFnsCode: *a4
                inn: *a5
                offer: *a6
                forceRefresh: *a7
                keepRegion: *a8
                regionFnsCodes:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                sortBy:
                  type: string
                  enum:
                    - median
                    - affordability
                    - vacancies
              required:
                - regionFnsCodes
              additionalProperties: true
      description: Вызов может сохранить данные или отправить сообщение. Для публикации, отклика и решений по
        кандидату нужна настоящая сессия MAX. Эти операции не выполняются автоматическим набором read-only
        проверок.
  /api/regions/{fnsCode}/digest:
    get:
      operationId: get__api_regions_fnsCode_digest
      summary: Сводка рынка по региону
      parameters:
        - name: fnsCode
          in: path
          required: true
          schema:
            type: string
        - name: professions
          in: query
          required: false
          schema:
            type: string
            description: Ключи профессий через запятую, используются первые 12
      security:
        - session: []
      responses:
        "200":
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionDigest"
        "400":
          description: Некорректные параметры или действие недоступно в демо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Сессия отсутствует/истекла или неверная подпись MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Источник или бот недоступен, либо заняты четыре расчета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cards/{id}/vacancy:
    post:
      operationId: post__api_cards_id_vacancy
      summary: Опубликовать вакансию из своей карточки
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - session: []
