# Каталог профессий. query — текст запроса к «Работе России»; synonyms — подстроки названия
# вакансии, которые считаем этой профессией; exclude — подстроки, которые исключают запись.
professions:
  - key: povar
    title: Повар
    query: повар
    synonyms: [повар]
    exclude: [шеф-повар, шеф повар, су-шеф, сушеф, бренд-шеф, помощник повара, повар-кассир, повар-продавец, преподаватель]
  - key: konditer
    title: Кондитер
    query: кондитер
    synonyms: [кондитер]
    exclude: [шеф-кондитер, помощник кондитера, технолог]
  - key: pekar
    title: Пекарь
    query: пекарь
    synonyms: [пекарь]
    exclude: [помощник пекаря, технолог]
  - key: ofitsiant
    title: Официант
    query: официант
    synonyms: [официант]
    exclude: [старший официант, менеджер]
  - key: barmen
    title: Бармен
    query: бармен
    synonyms: [бармен, бариста]
    exclude: [старший бармен, менеджер]
  - key: administrator
    title: Администратор
    query: администратор
    synonyms: [администратор]
    exclude: [системный администратор, администратор баз данных, администратор сети, администратор сервер, администратор безопасности, администратор 1с, старший администратор, администратор-программист]
  - key: kassir
    title: Кассир
    query: кассир
    synonyms: [кассир]
    exclude: [старший кассир, главный кассир, бухгалтер-кассир, кассир-бухгалтер, кассир-операционист, кассир банка, контролёр-кассир, контролер-кассир]
  - key: prodavets
    title: Продавец
    query: продавец
    synonyms: [продавец]
    exclude: [старший продавец, менеджер, руководитель, директор, продавец-консультант автомобил]
  - key: uborshchik
    title: Уборщик
    query: уборщик
    synonyms: [уборщик, уборщица]
    exclude: [старший, бригадир]
  - key: kurer
    title: Курьер
    query: курьер
    synonyms: [курьер]
    exclude: [старший курьер, руководитель]
  - key: voditel
    title: Водитель
    query: водитель
    synonyms: [водитель]
    exclude: [водитель автобуса, водитель троллейбуса, водитель трамвая, водитель погрузчика, водитель категории d, водитель категории е, водитель категории e, водитель-экспедитор категории с, машинист]
  - key: gruzchik
    title: Грузчик
    query: грузчик
    synonyms: [грузчик]
    exclude: [старший грузчик, бригадир]
  - key: svarshchik
    title: Сварщик
    query: сварщик
    synonyms: [сварщик, электросварщик, электрогазосварщик, газосварщик]
    exclude: [главный сварщик, инженер, мастер, вышкомонтажник, слесарь-сварщик]
  - key: slesar
    title: Слесарь
    query: слесарь
    synonyms: [слесарь]
    exclude: [главный, мастер, инженер, старший]
  - key: tokar
    title: Токарь
    query: токарь
    synonyms: [токарь]
    exclude: [мастер, инженер, старший]
