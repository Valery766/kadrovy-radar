# Сайт «Кадровый радар» (хакатон MAX) — мини-приложение и вебхук бота.
# Приложение слушает 127.0.0.1:8081, наружу его выставляет только nginx.
server {
    listen 80;
    listen [::]:80;
    server_name radar.digital-projects.tech;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radar.digital-projects.tech;

    ssl_certificate     /etc/letsencrypt/live/radar.digital-projects.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.digital-projects.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    server_tokens off;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
