# Сайт «Ставка» (хакатон MAX) — мини-приложение и вебхук бота.
# Приложение слушает 127.0.0.1:8081, наружу его выставляет только nginx.
server {
    listen 80;
    listen [::]:80;
    server_name stavka.i-tech.unecon.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stavka.i-tech.unecon.ru;

    ssl_certificate     /etc/letsencrypt/live/stavka.i-tech.unecon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stavka.i-tech.unecon.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    server_tokens off;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
